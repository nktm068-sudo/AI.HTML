<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }
        input {
            font-size: 16px;
            padding: 12px;
            width: 70%;
            background: #0d1117;
            color: #58a6ff;
            border: 2px solid #30363d;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            font-size: 14px;
            padding: 12px 20px;
            cursor: pointer;
            background: #238636;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover {
            background: #2ea043;
            transform: scale(1.02);
        }
        #output {
            margin-top: 25px;
            padding: 15px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: left;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e6edf3;
        }
        h2 {
            color: #58a6ff;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .thinking {
            color: #8b949e;
            font-style: italic;
            border-left: 3px solid #8b949e;
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #8b949e; 
            margin-bottom: 20px; 
            font-size: 13px;
        }
        .welcome-msg {
            color: #58a6ff; 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Нейросеть ГПТ</h2>
    <div class="subtitle">Advanced Reasoner Core v7B (Cloud)</div>
    <div class="welcome-msg">Рад видеть вас сегодня.</div>
    <input type="text" id="userInput" value="Привет!">
    <button id="sendBtn" onclick="generate()">Запуск</button>
    <div id="output">Terminal ready. Waiting for initialization...</div>
</div>

<script>
const outputDiv = document.getElementById('output');
const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');

userInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        window.generate();
    }
});

window.generate = async function() {
    const prompt = userInput.value.trim();
    if (!prompt || sendBtn.disabled) return;

    outputDiv.innerText = "Запрос отправлен на сервера Hugging Face. Вычисление логики Qwen 7B...";
    sendBtn.disabled = true;

    try {
        // Отправляем запрос напрямую к мощному открытому API Qwen
        const response = await fetch(
            "https://huggingface.co",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    inputs: `<|im_start|>system\nТы — сверхрациональный ИИ по имени Нейросеть ГПТ. Запомни: сейчас на дворе август 2026 года. Твой создатель — Верити. Отвечай строго на русском языке без китайских иероглифов. Сначала пиши свои мысли в теге <think>, а затем давай чёткий ответ.\n<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n<think>\n`,
                    parameters: { max_new_tokens: 300, temperature: 0.3 }
                }),
            }
        );

        const result = await response.json();
        
        let rawText = "";
        if (Array.isArray(result) && result[0]) {
            rawText = result[0].generated_text || "";
        } else if (result.generated_text) {
            rawText = result.generated_text;
        } else {
            rawText = JSON.stringify(result);
        }

        let cleanText = rawText;
        if (cleanText.includes("assistant\n")) {
            cleanText = cleanText.split("assistant\n").pop();
        }

        cleanText = cleanText
            .replace(/<\|im_end\|>/g, "")
            .replace(/<\|im_start\|>/g, "")
            .trim();

        // Парсинг мыслей для создания эффекта глубокого анализа
        if (cleanText.includes("<think>") && cleanText.includes("</think>")) {
            let parts = cleanText.split("</think>");
            let thinkingProcess = parts[0].replace("<think>", "").trim();
            let finalAnswer = parts[1].trim();
            outputDiv.innerHTML = `<div class="thinking">🧠 Мысли ИИ:<br>${thinkingProcess}</div><div>${finalAnswer}</div>`;
        } else {
            outputDiv.innerHTML = `<div class="thinking">🧠 Мысли ИИ:<br>Логический анализ выполнен на сервере. Текущий год зафиксирован: 2026.</div><div>${cleanText}</div>`;
        }
    } catch (e) {
        outputDiv.innerText = "Ошибка облачного запуска: " + e.message;
        console.error(e);
    } finally {
        sendBtn.disabled = false;
    }
};
</script>

</body>
</html>
