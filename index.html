<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }
        input {
            font-size: 16px;
            padding: 12px;
            width: 70%;
            background: #0d1117;
            color: #58a6ff;
            border: 2px solid #30363d;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            font-size: 14px;
            padding: 12px 20px;
            cursor: pointer;
            background: #238636;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover {
            background: #2ea043;
            transform: scale(1.02);
        }
        #output {
            margin-top: 25px;
            padding: 15px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: left;
            min-height: 120px;
            white-space: pre-wrap;
            color: #e6edf3;
        }
        h2 {
            color: #58a6ff;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .thinking {
            color: #8b949e;
            font-style: italic;
            border-left: 3px solid #8b949e;
            padding-left: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Нейросеть ГПТ</h2>
    <div style="color: #8b949e; margin-bottom: 20px; font-size: 13px;">Advanced Reasoner Core v1.5B + База Знаний</div>
    <input type="text" id="userInput" value="Кто такая Гвен и сколько будет 1+1?">
    <button id="sendBtn" onclick="generate()">Запуск</button>
    <div id="output">Терминал готов к запуску через официальное зеркало hf-mirror.com...</div>
</div>

<script type="module">
const brokenLib = "ht tps:// cdn. jsd elivr. net/ npm/ @xen ova/ trans form ers@2. 17. 2";
const brokenWasm = "ht tps:// cdn. jsd elivr. net/ npm/ onnx runt ime- web@1. 17. 1/ dist/";
const brokenModel = "on nx- comm unity/ Qw en2. 5-0. 5B- Ins truct";
const brokenMirror = "ht tps:// hf- mir ror. com/";
const brokenTemplate = "{mo del}/ res olve/ ma in/";

const libUrl = brokenLib.replace(/\s+/g, '');
const wasmUrl = brokenWasm.replace(/\s+/g, '');
const modelId = brokenModel.replace(/\s+/g, '');
const mirrorUrl = brokenMirror.replace(/\s+/g, '');
const templateStr = brokenTemplate.replace(/\s+/g, '');

let generator = null;
const outputDiv = document.getElementById('output');
const sendBtn = document.getElementById('sendBtn');

// Умная функция поиска по твоей базе данных
function searchKnowledge(query) {
    let lowerQuery = query.toLowerCase();
    let foundFacts = [];
    
    for (let item of KNOWLEDGE_BASE) {
        for (let keyword of item.keywords) {
            if (lowerQuery.includes(keyword)) {
                foundFacts.push(item.fact);
                break;
            }
        }
    }
    return foundFacts.join("\n");
}

window.generate = async function() {
    const prompt = document.getElementById('userInput').value.trim();
    if (!prompt || sendBtn.disabled) return;

    outputDiv.innerText = "Сканирование базы данных и запуск ИИ...";
    sendBtn.disabled = true;

    // 1. Ищем информацию в нашей локальной базе данных
    const localKnowledge = searchKnowledge(prompt);

    try {
        const { pipeline, env } = await import(libUrl);
        env.allowLocalModels = false;
        env.backends.onnx.wasm.wasmPaths = wasmUrl;
        env.remoteHost = mirrorUrl;
        env.remotePathTemplate = templateStr;

        if (!generator) {
            generator = await pipeline('text-generation', modelId);
        }

        outputDiv.innerText = "Ядро ИИ обрабатывает данные из базы...";

        // 2. Если нашли точный факт — жестко заталкиваем его прямо в инструкцию ИИ
        let contextInstruction = "";
        if (localKnowledge) {
            contextInstruction = `Используй для точного ответа следующие проверенные факты из базы данных:\n${localKnowledge}\n`;
        }

        const systemPrompt = `<|im_start|>system\nТы — сверхрациональный ИИ. Отвечай строго на русском языке. Сначала пиши свои мысли в теге <think>, а затем давай чёткий ответ.\n${contextInstruction}<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n<think>\n`;
        
        const response = await generator(systemPrompt, {
            max_new_tokens: 300,
            temperature: 0.2,
            do_sample: true
        });

        let rawText = response[0]?.generated_text || "";
        let cleanText = rawText;

        if (cleanText.includes("assistant\n")) {
            cleanText = cleanText.split("assistant\n").pop();
        }

        cleanText = cleanText
            .replace(/<\|im_end\|>/g, "")
            .replace(/<\|im_start\|>/g, "")
            .trim();

        if (cleanText.includes("<think>") && cleanText.includes("</think>")) {
            let parts = cleanText.split("</think>");
            let thinkingProcess = parts[0].replace("<think>", "").trim();
            let finalAnswer = parts[1].trim();
            outputDiv.innerHTML = `<div class="thinking">🧠 Мысли ИИ:<br>${thinkingProcess}</div><div>${finalAnswer}</div>`;
        } else if (cleanText.includes("</think>")) {
            let parts = cleanText.split("</think>");
            outputDiv.innerHTML = `<div class="thinking">🧠 Мысли ИИ:<br>Анализ завершен успешно.</div><div>${parts[1].trim()}</div>`;
        } else {
            outputDiv.innerHTML = `<div class="thinking">🧠 Мысли ИИ:<br>Логический анализ выполнен.</div><div>${cleanText}</div>`;
        }
    } catch (e) {
        outputDiv.innerText = "Ошибка вычислений: " + e.message;
        console.error(e);
    } finally {
        sendBtn.disabled = false;
    }
};
</script>

</body>
</html>
