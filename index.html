<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 8px; }
        input { font-size: 16px; padding: 10px; width: 70%; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { font-size: 14px; padding: 10px 15px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; margin: 5px; }
        #output { margin-top: 25px; padding: 15px; background: #111; border-radius: 4px; text-align: left; min-height: 100px; }
        .links-panel { background: #252526; padding: 15px; margin-bottom: 20px; border-radius: 6px; text-align: left; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Нейросеть ГПТ</h2>

    <div class="links-panel">
        <strong>Очистка системных адресов:</strong>
        <ul id="linksList"></ul>
        <button onclick="cleanAndLoad()" style="background: #28a745;">Очистить адреса и запустить ядро</button>
    </div>
    
    <input type="text" id="userInput" value="Write a story about Minecraft survival">
    <button id="sendBtn" onclick="generate()" disabled>Запуск</button>

    <div id="output">Нажмите зелёную кнопку для очистки и старта...</div>
</div>

<script type="module">
    const brokenLinks = [
        "https:// cdn. jsdelivr. net/ npm/ @xenova/ transformers @2.16.0",
        "https:// cors- anywhere. herokuapp. com/",
        "h t t p s : / / h u g g i n g f a c e . c o /"
    ];

    const list = document.getElementById('linksList');
    const outputDiv = document.getElementById('output');
    const sendBtn = document.getElementById('sendBtn');
    let generator = null;

    brokenLinks.forEach(link => { list.innerHTML += `<li>${link}</li>`; });

    window.cleanAndLoad = async function() {
        list.innerHTML = "";
        
        const cleanLib = brokenLinks[0].replace(/\s+/g, '');
        const cleanProxy = brokenLinks[1].replace(/\s+/g, '');
        const cleanHugging = brokenLinks[2].replace(/\s+/g, '');

        list.innerHTML += `<li style="color: #55ff55;">${cleanLib}</li>`;
        list.innerHTML += `<li style="color: #55ff55;">${cleanProxy}</li>`;
        list.innerHTML += `<li style="color: #55ff55;">${cleanHugging}</li>`;

        try {
            outputDiv.innerText = "Подключение модулей и загрузка весов...";
            
            const { pipeline, env } = await import(cleanLib);
            
            env.remoteURL = cleanProxy + cleanHugging;
            env.remoteModelPath = '';

            generator = await pipeline('text-generation', 'Xenova/LaMini-GPT-124M');
            outputDiv.innerText = "Ядро успешно инициализировано! Введите промпт.";
            sendBtn.disabled = false;
        } catch (e) {
            outputDiv.innerText = "Ошибка инициализации: " + e.message;
        }
    };

    window.generate = async function() {
        const prompt = document.getElementById('userInput').value.trim();
        if (!prompt || !generator) return;

        outputDiv.innerText = "Генерация ответа (до 500 токенов)...";
        sendBtn.disabled = true;

        const result = await generator(prompt, { 
            max_new_tokens: 500, // Новый лимит
            temperature: 0.7 
        });
        
        outputDiv.innerText = result.generated_text;
        sendBtn.disabled = false;
    };
</script>
</body>
</html>
