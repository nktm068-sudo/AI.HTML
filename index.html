<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; }
        .container { max-width: 750px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 12px; border: 2px solid #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.2); }
        input { font-size: 16px; padding: 12px; width: 70%; background: #0d1117; color: #58a6ff; border: 2px solid #30363d; border-radius: 6px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { font-size: 14px; padding: 12px 20px; cursor: pointer; background: #238636; color: white; font-weight: bold; border: none; border-radius: 6px; margin: 5px; transition: 0.2s; }
        button:hover { background: #2ea043; transform: scale(1.02); }
        #output { margin-top: 25px; padding: 15px; background: #0d1117; border-radius: 6px; border: 1px solid #30363d; text-align: left; min-height: 120px; white-space: pre-wrap; color: #e6edf3; }
        h2 { color: #58a6ff; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .thinking { color: #8b949e; font-style: italic; border-left: 3px solid #8b949e; padding-left: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Нейросеть ГПТ</h2>
        <div style="color: #8b949e; margin-bottom: 20px; font-size: 13px;">Advanced Reasoner Core v1.5B</div>
        <input type="text" id="userInput" value="Привет! Напиши простую функцию на JavaScript" onkeydown="if(event.key === 'Enter') generate()">
        <button id="sendBtn" onclick="generate()">Запуск</button>
        <div id="output">Терминал готов к запуску ядра Нейросети ГПТ...</div>
    </div>

    <script type="module">
        // ССЫЛКИ С ПРОБЕЛАМИ (Удали пробелы внутри кавычек перед сохранением!)
        const brokenLib = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0";
        const brokenWasm = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/";
        const brokenModel = "Xenova/DeepSeek-R1-Distill-Qwen-1.5B";
        const brokenCDN = "https://esm.sh/@xenova/transformers/models/";

        const libUrl = brokenLib.replace(/\s+/g, '');
        const wasmUrl = brokenWasm.replace(/\s+/g, '');
        const modelId = brokenModel.replace(/\s+/g, '');
        const cdnUrl = brokenCDN.replace(/\s+/g, '');

        let generator = null;
        const outputDiv = document.getElementById('output');
        const sendBtn = document.getElementById('sendBtn');

        window.generate = async function() {
            const prompt = document.getElementById('userInput').value.trim();
            if (!prompt || sendBtn.disabled) return;

            outputDiv.innerText = "Подключение к сети и скачивание ядра ИИ (займет около 30 секунд от вайфая)...";
            sendBtn.disabled = true;

            try {
                const { pipeline, env } = await import(libUrl);
                env.allowLocalModels = false;
                env.backends.onnx.wasm.wasmPaths = wasmUrl;
                env.remoteHost = cdnUrl;
                env.remotePathTemplate = '{model}/';

                if (!generator) {
                    generator = await pipeline('text-generation', modelId);
                }

                outputDiv.innerText = "Ядро ИИ вычисляет логику и пишет ответ...";

                // Нейтральный системный промпт без лишних упоминаний
                const systemPrompt = `<|im_start|>system\nТы — полноценная Нейросеть ГПТ. Сначала напиши свои мысли внутри тега <think>...</think> на русском языке, а затем выдай подробный ответ.\n<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n`;

                const response = await generator(systemPrompt, {
                    max_new_tokens: 500,
                    temperature: 0.6,
                    do_sample: true
                });

                let rawText = response.generated_text || "";
                let cleanText = rawText;
                
                if (cleanText.includes("assistant\n")) {
                    cleanText = cleanText.split("assistant\n").pop();
                } else if (cleanText.includes("<|im_start|>assistant")) {
                    cleanText = cleanText.split("<|im_start|>assistant").pop();
                }
                
                cleanText = cleanText
                    .replace(/<\|im_end\|>/g, "")
                    .replace(/<\|im_start\|>/g, "")
                    .replace(/system/g, "")
                    .replace(/user/g, "")
                    .replace(/assistant/g, "")
                    .trim();

                // Форматируем тег мышления в красивый блок
                if (cleanText.includes("<think>") && cleanText.includes("</think>")) {
                    let parts = cleanText.split("</think>");
                    let thinkingProcess = parts[0].replace("<think>", "").trim();
                    let finalAnswer = parts[1].trim();
                    
                    outputDiv.innerHTML = `<div class="thinking">🧠 Процесс логического мышления:<br>${thinkingProcess}</div><div>${finalAnswer}</div>`;
                } else {
                    outputDiv.innerText = cleanText || "Ошибка генерации.";
                }

            } catch (e) {
                outputDiv.innerText = "Ошибка запуска ИИ: " + e.message + "\nПопробуйте обновить страницу.";
                console.error(e);
            } finally {
                sendBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
