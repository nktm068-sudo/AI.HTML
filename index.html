<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 50px; 
        }
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 8px; 
        }
        input { 
            font-size: 16px; 
            padding: 10px; 
            width: 70%; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px; 
        }
        button { 
            font-size: 14px; 
            padding: 10px 15px; 
            cursor: pointer; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            margin: 5px; 
        }
        #output { 
            margin-top: 25px; 
            padding: 15px; 
            background: #111; 
            border-radius: 4px; 
            text-align: left; 
            min-height: 100px; 
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Нейросеть ГПТ</h2>
        <br>
        <input type="text" id="userInput" value="Привет!" onkeydown="if(event.key === 'Enter') generate()">
        <button id="sendBtn" onclick="generate()" disabled>Запуск</button>
        <div id="output">Инициализация модулей...</div>
    </div>

    <script type="module">
        // ССЫЛКИ С ПРОБЕЛАМИ (Удалите пробелы внутри кавычек перед запуском!)
        const brokenLinks = [
            "https://cdn.jsdelivr.net/npm/@xenova/transformers @2.16.0",
            "https://hf-mirror.com/" 
        ];

        const libUrl = brokenLinks[0].replace(/\s+/g, '');
        const mirrorUrl = brokenLinks[1].replace(/\s+/g, '');

        const outputDiv = document.getElementById('output');
        const sendBtn = document.getElementById('sendBtn');
        let generator = null;

        async function init() {
            try {
                const { pipeline, env } = await import(libUrl);
                
                env.allowLocalModels = false;
                env.remoteURL = mirrorUrl; 
                env.remoteModelPath = '';

                outputDiv.innerText = "Скачивание умной чат-модели. (около 500МБ)... Первая загрузка может занять пару минут.";
                
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                
                outputDiv.innerText = "Нейросеть Qwen успешно загружена и готова к работе!";
                sendBtn.disabled = false;
            } catch (e) {
                outputDiv.innerText = "Ошибка загрузки: " + e.message;
                console.error(e);
            }
        }

        window.generate = async function() {
            const prompt = document.getElementById('userInput').value.trim();
            if (!prompt || !generator || sendBtn.disabled) return;

            outputDiv.innerText = "Нейросеть обдумывает ответ...";
            sendBtn.disabled = true;

            setTimeout(async () => {
                try {
                    // Формат диалога для чат-модели Qwen
                    const messages = [
                        { role: "system", content: "Ты — полезный ИИ-ассистент. Отвечай грамотно и только на русском языке." },
                        { role: "user", content: prompt }
                    ];

                    const result = await generator(messages, { 
                        max_new_tokens: 500, // Вернули лимит 500 токенов
                        temperature: 0.7,
                        do_sample: true
                    });

                    // ИСПРАВЛЕНО: Правильный парсинг ответа (без result[0])
                    outputDiv.innerText = result.generated_text.at(-1).content;
                } catch (e) {
                    outputDiv.innerText = "Ошибка генерации текста: " + e.message;
                    console.error(e);
                } finally {
                    sendBtn.disabled = false;
                }
            }, 50);
        };

        init();
    </script>
</body>
</html>
