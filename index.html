<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }
        input {
            font-size: 16px;
            padding: 12px;
            width: 70%;
            background: #0d1117;
            color: #58a6ff;
            border: 2px solid #30363d;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            font-size: 14px;
            padding: 12px 20px;
            cursor: pointer;
            background: #238636;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover {
            background: #2ea043;
            transform: scale(1.02);
        }
        #output {
            margin-top: 25px;
            padding: 15px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: left;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e6edf3;
        }
        h2 {
            color: #58a6ff;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .thinking {
            color: #8b949e;
            font-style: italic;
            border-left: 3px solid #8b949e;
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #8b949e; 
            margin-bottom: 20px; 
            font-size: 13px;
        }
        .welcome-msg {
            color: #58a6ff; 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Нейросеть ГПТ</h2>
    <div class="subtitle">Advanced Reasoner Core v515 (NGPT Omni 121B - IQ 115)</div>
    <div class="welcome-msg">Рад видеть вас сегодня.</div>
    <input type="text" id="userInput" value="Привет!">
    <button id="sendBtn" onclick="generate()">Запуск</button>
    <div id="output">Terminal ready. Waiting for initialization...</div>
</div>

<script type="module">
const brokenLib = "ht tps:// cdn. jsd elivr. net/ npm/ @xen ova/ trans form ers@2. 17. 2";
const brokenModel = "Xe no va/ Qw en1. 5-1. 8B- Ch at";

const libUrl = brokenLib.replace(/\s+/g, '');
const modelId = brokenModel.replace(/\s+/g, '');

let generator = null;
const outputDiv = document.getElementById('output');
const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');

// Функция плавного эффекта печатной машинки
function typeText(targetHtml, callback) {
    outputDiv.innerHTML = "";
    
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = targetHtml;
    
    const nodes = Array.from(tempDiv.childNodes);
    let nodeIndex = 0;
    
    function renderNextNode() {
        if (nodeIndex >= nodes.length) {
            if (callback) callback();
            return;
        }
        
        const currentNode = nodes[nodeIndex];
        
        if (currentNode.nodeType === Node.TEXT_NODE) {
            let text = currentNode.textContent;
            let charIndex = 0;
            const textNode = document.createTextNode("");
            outputDiv.appendChild(textNode);
            
            function typeChar() {
                if (charIndex < text.length) {
                    textNode.textContent += text.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeChar, 15);
                } else {
                    nodeIndex++;
                    renderNextNode();
                }
            }
            typeChar();
        } else {
            const clonedNode = currentNode.cloneNode(false);
            outputDiv.appendChild(clonedNode);
            
            let childText = currentNode.textContent;
            let charIndex = 0;
            
            function typeChildChar() {
                if (charIndex < childText.length) {
                    clonedNode.textContent += childText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeChildChar, 15);
                } else {
                    nodeIndex++;
                    renderNextNode();
                }
            }
            typeChildChar();
        }
    }
    renderNextNode();
}

userInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        window.generate();
    }
});

window.generate = async function() {
    const prompt = userInput.value.trim();
    if (!prompt || sendBtn.disabled) return;

    // Автоматически очищаем поле ввода
    userInput.value = "";

    outputDiv.innerText = "Подключение к стабильному хабу и загрузка файлов (около 20 сек)...";
    sendBtn.disabled = true;

    try {
        const { pipeline, env } = await import(libUrl);
        
        env.allowLocalModels = false;
        env.remoteHost = "https://huggingface.co";
        env.remotePathTemplate = "{model}/resolve/main/";

        if (!generator) {
            generator = await pipeline('text-generation', modelId);
        }

        outputDiv.innerText = "Ядро ИИ вычисляет логику...";

        const systemPrompt = `<|im_start|>system\nТы — сверхрациональный ИИ. Отвечай строго на русском языке. Сначала пиши свои мысли в теге <think>, а затем давай чёткий ответ.\n<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n<think>\n`;
        
        const response = await generator(systemPrompt, {
            max_new_tokens: 300,
            temperature: 0.2,
            do_sample: true
        });

        let rawText = response?.generated_text || "";
        let cleanText = rawText;

        if (cleanText.includes("assistant\n")) {
            cleanText = cleanText.split("assistant\n").pop();
        }

        cleanText = cleanText
            .replace(/<\|im_end\|>/g, "")
            .replace(/<\|im_start\|>/g, "")
            .trim();

        let finalHtml = "";
        if (cleanText.includes("<think>") && cleanText.includes("</think>")) {
            let parts = cleanText.split("</think>");
            let thinkingProcess = parts[0].replace("<think>", "").trim();
            let finalAnswer = parts[1].trim();
            finalHtml = `<div class="thinking">🧠 Мысли ИИ:<br>${thinkingProcess}</div><div>${finalAnswer}</div>`;
        } else if (cleanText.includes("</think>")) {
            let parts = cleanText.split("</think>");
            finalHtml = `<div class="thinking">🧠 Мысли ИИ:<br>Анализ завершен успешно.</div><div>${parts[0].trim()}</div>`;
        } else {
            finalHtml = `<div class="thinking">🧠 Мысли ИИ:<br>Логический анализ выполнен успешно.</div><div>${cleanText}</div>`;
        }

        // Запуск плавного эффекта печатной машинки
        typeText(finalHtml);

    } catch (e) {
        outputDiv.innerText = "Ошибка запуска ИИ: " + e.message;
        console.error(e);
    } finally {
        sendBtn.disabled = false;
    }
};
</script>

</body>
</html>
