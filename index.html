<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 50px; 
        }
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 8px; 
        }
        input { 
            font-size: 16px; 
            padding: 10px; 
            width: 70%; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px; 
        }
        button { 
            font-size: 14px; 
            padding: 10px 15px; 
            cursor: pointer; 
            background: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            margin: 5px; 
        }
        #output { 
            margin-top: 25px; 
            padding: 15px; 
            background: #111; 
            border-radius: 4px; 
            text-align: left; 
            min-height: 100px; 
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Нейросеть ГПТ</h2>
        <br>
        <input type="text" id="userInput" value="Привет!" onkeydown="if(event.key === 'Enter') generate()">
        <button id="sendBtn" onclick="generate()" disabled>Запуск</button>
        <div id="output">Инициализация модулей...</div>
    </div>

    <script type="module">
        // ССЫЛКА С ПРОБЕЛАМИ (Удали пробелы внутри кавычек перед запуском!)
        const brokenLink = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0";
        const libUrl = brokenLink.replace(/\s+/g, '');

        const outputDiv = document.getElementById('output');
        const sendBtn = document.getElementById('sendBtn');
        let generator = null;

        async function init() {
            try {
                // Подгружаем библиотеку динамически
                const { pipeline, env } = await import(libUrl);

                // Включаем поиск модели локально в твоем репозитории
                env.allowLocalModels = true;
                env.remoteURL = ''; 
                env.remoteModelPath = '';

                outputDiv.innerText = "Загрузка твоей личной обученной нейросети из папки репозитория...";
                
                // Сайт будет искать файлы в папке my-model у тебя на гитхабе
                generator = await pipeline('text-generation', './my-model/');
                
                outputDiv.innerText = "Твоя личная нейросеть успешно загружена и готова к работе!";
                sendBtn.disabled = false;
            } catch (e) {
                outputDiv.innerText = "Ожидание загрузки файлов модели в репозиторий... Ошибка: " + e.message;
                console.error(e);
            }
        }

        window.generate = async function() {
            const prompt = document.getElementById('userInput').value.trim();
            if (!prompt || !generator || sendBtn.disabled) return;

            outputDiv.innerText = "Нейросеть пишет ответ...";
            sendBtn.disabled = true;

            setTimeout(async () => {
                try {
                    // Формат диалога без имён, на котором сейчас учится модель в Colab
                    const formattedPrompt = `User: ${prompt}\nAssistant:`;

                    const result = await generator(formattedPrompt, { 
                        max_new_tokens: 200, 
                        temperature: 0.4, 
                        do_sample: true
                    });

                    let responseText = result.generated_text;

                    // Аккуратно отрезаем технические маркеры, чтобы показать чистый ответ
                    if (responseText.includes("Assistant:")) {
                        responseText = responseText.split("Assistant:").pop().trim();
                    } else if (responseText.startsWith(formattedPrompt)) {
                        responseText = responseText.substring(formattedPrompt.length).trim();
                    }

                    outputDiv.innerText = responseText || "Модель задумалась, попробуй другой вопрос.";
                } catch (e) {
                    outputDiv.innerText = "Ошибка генерации: " + e.message;
                    console.error(e);
                } finally {
                    sendBtn.disabled = false;
                }
            }, 50);
        };

        init();
    </script>
</body>
</html>
