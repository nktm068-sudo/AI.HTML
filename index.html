<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нейросеть ГПТ</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 8px; }
        input { font-size: 16px; padding: 10px; width: 70%; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { font-size: 14px; padding: 10px 15px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 4px; margin: 5px; }
        #output { margin-top: 25px; padding: 15px; background: #111; border-radius: 4px; text-align: left; min-height: 100px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Нейросеть ГПТ</h2>
        <br>
        <input type="text" id="userInput" value="Привет! Расскажи историю про майнкрафт" onkeydown="if(event.key === 'Enter') generate()">
        <button id="sendBtn" onclick="generate()">Запуск</button>
        <div id="output">Система готова. Задай любой вопрос Нейросети ГПТ...</div>
    </div>

    <script type="module">
        // ССЫЛКИ С ПРОБЕЛАМИ (Удали пробелы внутри кавычек перед сохранением!)
        const brokenLib = "https:// cdn. jsdelivr. net/ npm/ @xenova/ transformers @2.16.0";
        const brokenWasm = "https:// cdn. jsdelivr. net/ npm/ onnxruntime- web@1.14.0/ dist/";
        const brokenModel = "Xenova/ SmolLM- 135M- Instruct";
        const brokenMirror = "https:// hf- mirror. com";
        
        // Исправлено: Очищаем каждую строку по отдельности через регулярное выражение
        const libUrl = brokenLib.replace(/\s+/g, '');
        const wasmUrl = brokenWasm.replace(/\s+/g, '');
        const modelId = brokenModel.replace(/\s+/g, '');
        const mirrorUrl = brokenMirror.replace(/\s+/g, '');

        let generator = null;
        const outputDiv = document.getElementById('output');
        const sendBtn = document.getElementById('sendBtn');

        window.generate = async function() {
            const prompt = document.getElementById('userInput').value.trim();
            if (!prompt || sendBtn.disabled) return;

            outputDiv.innerText = "Нейросеть ГПТ подгружает файлы модели в браузер (около 15 секунд)...";
            sendBtn.disabled = true;

            try {
                // Подключаем библиотеку ИИ
                const { pipeline, env } = await import(libUrl);
                env.backends.onnx.wasm.wasmPaths = wasmUrl;
                
                // Настраиваем скачивание через быстрое зеркало hf-mirror
                env.allowLocalModels = false;
                env.remoteHost = mirrorUrl;
                env.remotePathTemplate = '{model}/resolve/{revision}/';

                // Загружаем микро-модель SmolLM в память вкладки браузера
                if (!generator) {
                    generator = await pipeline('text-generation', modelId);
                }

                outputDiv.innerText = "Нейросеть ГПТ формулирует ответ...";

                // Шаблон диалога для модели
                const systemPrompt = `<|im_start|>system\nТы — полноценная Нейросеть ГПТ. Отвечай кратко на русском языке.\n<|im_end|>\n<|im_start|>user\n${prompt}\n<|im_end|>\n<|im_start|>assistant\n`;

                const response = await generator(systemPrompt, {
                    max_new_tokens: 120,
                    temperature: 0.4,
                    do_sample: true
                });

                let rawText = response.generated_text || "";
                
                // Жесткая очистка системного мусора
                let cleanText = rawText;
                
                if (cleanText.includes("assistant\n")) {
                    cleanText = cleanText.split("assistant\n").pop();
                } else if (cleanText.includes("<|im_start|>assistant")) {
                    cleanText = cleanText.split("<|im_start|>assistant").pop();
                }
                
                cleanText = cleanText
                    .replace(/<\|im_end\|>/g, "")
                    .replace(/<\|im_start\|>/g, "")
                    .replace(/system/g, "")
                    .replace(/user/g, "")
                    .replace(/assistant/g, "")
                    .trim();
                
                outputDiv.innerText = cleanText || "Модель задумалась. Попробуй перефразировать вопрос!";

            } catch (e) {
                outputDiv.innerText = "Ошибка: " + e.message;
                console.error(e);
            } finally {
                sendBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
